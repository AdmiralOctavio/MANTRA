name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries for gmsh and Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa libxcursor1 libxinerama1 libxft2 libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: pip install -e ".[gui,dev]"
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install ".[gui]" pyinstaller
      - name: Build
        run: pyinstaller --noconfirm packaging/thrust_chamber_designer.spec
      - name: Self test of the app (nozzle and a coarse thermal run)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\ThrustChamberDesigner\ThrustChamberDesigner.exe -ArgumentList '--self-test', "$PWD\self_test" -Wait -PassThru
          Get-Content self_test\self_test.txt -ErrorAction SilentlyContinue
          exit $p.ExitCode
      - uses: actions/upload-artifact@v4
        with:
          name: ThrustChamberDesigner-windows
          path: dist/ThrustChamberDesigner
