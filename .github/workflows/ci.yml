name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries for gmsh and Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa libxcursor1 libxinerama1 libxft2 libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: pip install -e ".[gui,dev]"
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install ".[gui]" pyinstaller
      - name: Build
        run: pyinstaller --noconfirm packaging/thrust_chamber_designer.spec
      - name: Self test of the app (nozzle and a coarse thermal run)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\ThrustChamberDesigner\ThrustChamberDesigner.exe -ArgumentList '--self-test', "$PWD\self_test" -Wait -PassThru
          Get-Content self_test\self_test.txt -ErrorAction SilentlyContinue
          exit $p.ExitCode
      - uses: actions/upload-artifact@v4
        with:
          name: ThrustChamberDesigner-windows
          path: dist/ThrustChamberDesigner

  # When a release is published on the Releases page, the tested Windows app is attached to it as a zip
  release:
    if: github.event_name == 'release'
    needs: [tests, windows-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ThrustChamberDesigner-windows
          path: ThrustChamberDesigner
      - name: Zip
        run: zip -r -q ThrustChamberDesigner-windows.zip ThrustChamberDesigner
      - uses: softprops/action-gh-release@v2
        with:
          files: ThrustChamberDesigner-windows.zip
